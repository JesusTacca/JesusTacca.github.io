<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novelas</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #121212;
      color: #eee;
    }

    header {
      padding: 1rem;
      text-align: center;
      background: #1e1e1e;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .novels {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }

    .novel-card {
      background: #1f1f1f;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      display: block;
    }

    .novel-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,.4);
    }

    .novel-cover {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #333;
    }

    .novel-info {
      padding: 0.75rem;
    }

    .novel-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .novel-meta {
      font-size: 0.8rem;
      color: #aaa;
    }

    @media (max-width: 600px) {
      .novel-cover {
        height: 180px;
      }
    }
  </style>
</head>
<body>

<header>📚 Novelas</header>

<section class="novels">

  <!-- NOVELA -->
  <a href="NnBI/" class="novel-card">
    <div class="novel-info">
      <div class="novel-title">Nageki no Bourei wa Intai Shitai</div>
    </div>
  </a>
  <a href="konosuba/" class="novel-card">
    <div class="novel-info">
      <div class="novel-title">Kono Subarashii Sekai ni Shukufuku wo!</div>
    </div>
  </a>
  <a href="wizard-isekai/" class="novel-card">
    <div class="novel-info">
      <div class="novel-title">Isekai Majutsushi wa Mahou wo Tonaenai</div>
    </div>
  </a>

</section>

</body>
</html>
